<?xml version="1.0" encoding="UTF-8"?>
<!-- VALIQ - Ascent top-down schematic map -->
<!-- Original geometry, drawn from community callout documentation. No Riot Games assets used. Not endorsed by Riot Games. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <style>
      text { font-family: sans-serif; font-size: 13px; fill: #e8e8e8; font-weight: 600; text-anchor: middle; }
      text.label-small { font-size: 11px; fill: #c0c0c0; font-weight: 400; }
      text.site-label { font-size: 18px; fill: #ffffff; font-weight: 700; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="#1a1a2e"/>

  <!-- === WALLS layer === -->
  <g id="walls">
    <!-- Outer boundary -->
    <rect x="30" y="30" width="940" height="940" fill="none" stroke="#4a4a6a" stroke-width="3"/>

    <!-- Attacker spawn -->
    <rect x="40" y="40" width="180" height="160" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>

    <!-- Defender spawn -->
    <rect x="780" y="800" width="180" height="160" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>

    <!-- A Main corridor wall top -->
    <polygon points="220,40 220,300 350,300 350,40" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>

    <!-- A Lobby open area -->
    <rect x="40" y="200" width="310" height="130" fill="#2a2a45" stroke="#5a5a7a" stroke-width="1"/>

    <!-- A Site walls -->
    <polygon points="220,330 220,540 500,540 500,330 350,330 350,300 220,300" fill="none" stroke="#5a5a7a" stroke-width="2"/>

    <!-- A Short connector -->
    <rect x="500" y="330" width="100" height="110" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>

    <!-- Mid Top courtyard -->
    <rect x="350" y="40" width="300" height="280" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>
    <!-- Mid box / market interior -->
    <rect x="390" y="70" width="220" height="120" fill="#252540" stroke="#5a5a7a" stroke-width="1"/>

    <!-- Mid link / catwalk -->
    <rect x="600" y="40" width="80" height="200" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>

    <!-- B Main corridor -->
    <rect x="680" y="40" width="280" height="200" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>

    <!-- B Site -->
    <rect x="500" y="240" width="280" height="200" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>

    <!-- CT Spawn area upper -->
    <rect x="600" y="440" width="360" height="160" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>

    <!-- B Short -->
    <rect x="500" y="440" width="100" height="100" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>

    <!-- Mid bottom connector -->
    <rect x="350" y="400" width="150" height="140" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>

    <!-- Lower mid / mid bot -->
    <rect x="350" y="540" width="150" height="100" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>

    <!-- A Lobby lower -->
    <rect x="40" y="540" width="310" height="180" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>

    <!-- A Link lower -->
    <rect x="40" y="720" width="310" height="100" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>

    <!-- Lower passage to B -->
    <rect x="350" y="720" width="430" height="100" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>

    <!-- Defender side lower -->
    <rect x="600" y="600" width="360" height="120" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>

    <!-- Bottom area -->
    <rect x="40" y="820" width="740" height="150" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>
  </g>

  <!-- === ZONES layer === -->
  <g id="zones">
    <!-- Attacker spawn -->
    <rect x="42" y="42" width="176" height="156" fill="#3d3d6b" opacity="0.7"/>

    <!-- Defender spawn -->
    <rect x="782" y="802" width="176" height="156" fill="#3d6b3d" opacity="0.7"/>

    <!-- A Site -->
    <rect x="222" y="332" width="276" height="206" fill="#b85c5c" opacity="0.55"/>

    <!-- B Site -->
    <rect x="502" y="242" width="276" height="196" fill="#5c6fb8" opacity="0.55"/>

    <!-- Mid top courtyard -->
    <rect x="352" y="42" width="296" height="276" fill="#5a5a3d" opacity="0.4"/>

    <!-- Catwalk -->
    <rect x="602" y="42" width="76" height="196" fill="#4a4a3d" opacity="0.5"/>

    <!-- A Main -->
    <rect x="42" y="202" width="176" height="126" fill="#6b5c3d" opacity="0.4"/>

    <!-- B Main -->
    <rect x="682" y="42" width="276" height="196" fill="#6b5c3d" opacity="0.4"/>

    <!-- CT Mid -->
    <rect x="602" y="442" width="356" height="156" fill="#3d5a6b" opacity="0.4"/>

    <!-- Mid bot -->
    <rect x="352" y="402" width="148" height="236" fill="#5a5a3d" opacity="0.35"/>

    <!-- Lower road -->
    <rect x="352" y="722" width="426" height="96" fill="#3d3d5a" opacity="0.4"/>
  </g>

  <!-- === SITES labels === -->
  <g id="sites">
    <!-- A Site marker -->
    <circle cx="360" cy="435" r="22" fill="#b85c5c" opacity="0.9"/>
    <text x="360" y="440" class="site-label">A</text>

    <!-- B Site marker -->
    <circle cx="640" cy="340" r="22" fill="#5c6fb8" opacity="0.9"/>
    <text x="640" y="345" class="site-label">B</text>
  </g>

  <!-- === LABELS layer === -->
  <g id="labels">
    <!-- Spawns -->
    <text x="130" y="122">ATK</text>
    <text x="130" y="137" class="label-small">Spawn</text>
    <text x="870" y="882">DEF</text>
    <text x="870" y="897" class="label-small">Spawn</text>

    <!-- A site callouts -->
    <text x="360" y="490">A Site</text>
    <text x="130" y="268">A Lobby</text>
    <text x="283" y="175" class="label-small">A Main</text>

    <!-- Mid callouts -->
    <text x="500" y="165">Mid Top</text>
    <text x="490" y="130" class="label-small">(Market)</text>
    <text x="638" y="135">Catwalk</text>
    <text x="426" y="490">Mid Bot</text>

    <!-- B site callouts -->
    <text x="640" y="300">B Site</text>
    <text x="820" y="130">B Main</text>

    <!-- CT area -->
    <text x="780" y="522">CT Mid</text>
    <text x="780" y="540" class="label-small">/ B Short</text>

    <!-- Lower area -->
    <text x="175" y="625">A Short</text>
    <text x="560" y="767">Lower Road</text>
    <text x="175" y="775">A Link</text>

    <!-- Bottom -->
    <text x="390" y="900">Defender Lower</text>
  </g>

  <!-- Legend -->
  <g transform="translate(20, 960)">
    <rect x="0" y="0" width="14" height="10" fill="#b85c5c" opacity="0.9"/>
    <text x="18" y="9" class="label-small" text-anchor="start">Site A</text>
    <rect x="70" y="0" width="14" height="10" fill="#5c6fb8" opacity="0.9"/>
    <text x="88" y="9" class="label-small" text-anchor="start">Site B</text>
    <rect x="140" y="0" width="14" height="10" fill="#3d3d6b" opacity="0.9"/>
    <text x="158" y="9" class="label-small" text-anchor="start">ATK</text>
    <rect x="200" y="0" width="14" height="10" fill="#3d6b3d" opacity="0.9"/>
    <text x="218" y="9" class="label-small" text-anchor="start">DEF</text>
    <text x="400" y="9" class="label-small" text-anchor="start">VALIQ - Not endorsed by Riot Games</text>
  </g>
</svg>
