<?xml version="1.0" encoding="UTF-8"?>
<!-- VALIQ - Haven top-down schematic map -->
<!-- Original geometry drawn from community callout documentation. No Riot Games assets used. Not endorsed by Riot Games. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <style>
      text { font-family: sans-serif; font-size: 13px; fill: #e8e8e8; font-weight: 600; text-anchor: middle; }
      text.label-small { font-size: 11px; fill: #c0c0c0; font-weight: 400; }
      text.site-label { font-size: 18px; fill: #ffffff; font-weight: 700; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="#1a1a2e"/>

  <!-- === WALLS layer === -->
  <g id="walls">
    <!-- Outer boundary -->
    <rect x="30" y="30" width="940" height="940" fill="none" stroke="#4a4a6a" stroke-width="3"/>

    <!-- Attacker Spawn - bottom center -->
    <rect x="380" y="800" width="240" height="160" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>

    <!-- Defender Spawn - top center (long CT corridor) -->
    <rect x="380" y="40" width="240" height="100" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>

    <!-- === C SITE AREA (left) === -->
    <!-- C Long approach -->
    <rect x="40" y="600" width="160" height="200" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>

    <!-- C Lobby / C Main -->
    <rect x="40" y="480" width="220" height="120" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>

    <!-- C Site -->
    <rect x="40" y="300" width="280" height="180" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>

    <!-- C Link corridor -->
    <rect x="200" y="200" width="120" height="100" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>

    <!-- C Short / C Garage -->
    <rect x="200" y="480" width="180" height="120" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>

    <!-- === MIDDLE (B SITE AREA) === -->
    <!-- Mid top connector from CT -->
    <rect x="320" y="140" width="360" height="160" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>

    <!-- B Window area / Mid -->
    <rect x="320" y="300" width="180" height="180" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>

    <!-- B Site -->
    <rect x="320" y="480" width="360" height="200" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>

    <!-- B Entrance from ATK -->
    <rect x="380" y="680" width="240" height="120" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>

    <!-- === A SITE AREA (right) === -->
    <!-- A Long approach -->
    <rect x="680" y="600" width="280" height="200" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>

    <!-- A Lobby / A Main -->
    <rect x="740" y="480" width="220" height="120" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>

    <!-- A Site -->
    <rect x="680" y="300" width="280" height="180" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>

    <!-- A Link corridor -->
    <rect x="680" y="200" width="120" height="100" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>

    <!-- A Short -->
    <rect x="620" y="480" width="120" height="120" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>

    <!-- === CT CORRIDOR (top, connects all 3 sites) === -->
    <!-- Top CT corridor - the long defender artery -->
    <rect x="200" y="140" width="120" height="200" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>
    <rect x="680" y="140" width="120" height="200" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>
    <rect x="40" y="140" width="160" height="160" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>
    <rect x="800" y="140" width="160" height="160" fill="#2a2a45" stroke="#5a5a7a" stroke-width="2"/>
  </g>

  <!-- === ZONES layer === -->
  <g id="zones">
    <!-- ATK Spawn -->
    <rect x="382" y="802" width="236" height="156" fill="#3d3d6b" opacity="0.7"/>

    <!-- DEF Spawn -->
    <rect x="382" y="42" width="236" height="96" fill="#3d6b3d" opacity="0.7"/>

    <!-- C Site -->
    <rect x="42" y="302" width="276" height="176" fill="#e67e22" opacity="0.5"/>

    <!-- B Site -->
    <rect x="322" y="482" width="356" height="196" fill="#5c6fb8" opacity="0.55"/>

    <!-- A Site -->
    <rect x="682" y="302" width="276" height="176" fill="#b85c5c" opacity="0.55"/>

    <!-- CT artery top -->
    <rect x="42" y="142" width="916" height="156" fill="#3d5a6b" opacity="0.45"/>

    <!-- Mid connector (B Window/Mid) -->
    <rect x="322" y="302" width="176" height="176" fill="#5a5a3d" opacity="0.4"/>

    <!-- C Long -->
    <rect x="42" y="482" width="376" height="316" fill="#7a5c3d" opacity="0.35"/>

    <!-- A Long -->
    <rect x="582" y="482" width="376" height="316" fill="#7a5c3d" opacity="0.35"/>

    <!-- B entrance lane -->
    <rect x="382" y="682" width="236" height="116" fill="#5a5a6b" opacity="0.4"/>
  </g>

  <!-- === SITES layer === -->
  <g id="sites">
    <!-- C Site marker -->
    <circle cx="180" cy="390" r="22" fill="#e67e22" opacity="0.9"/>
    <text x="180" y="395" class="site-label">C</text>

    <!-- B Site marker -->
    <circle cx="500" cy="580" r="22" fill="#5c6fb8" opacity="0.9"/>
    <text x="500" y="585" class="site-label">B</text>

    <!-- A Site marker -->
    <circle cx="820" cy="390" r="22" fill="#b85c5c" opacity="0.9"/>
    <text x="820" y="395" class="site-label">A</text>
  </g>

  <!-- === LABELS layer === -->
  <g id="labels">
    <!-- Spawns -->
    <text x="500" y="880">ATK Spawn</text>
    <text x="500" y="88">DEF Spawn</text>

    <!-- CT corridor -->
    <text x="500" y="218">CT Corridor</text>
    <text x="500" y="233" class="label-small">(Defender Artery)</text>
    <text x="120" y="218" class="label-small">C CT</text>
    <text x="880" y="218" class="label-small">A CT</text>

    <!-- C site callouts -->
    <text x="180" y="430">C Site</text>
    <text x="110" y="695">C Long</text>
    <text x="100" y="555">C Lobby</text>
    <text x="290" y="545">C Garage</text>

    <!-- B site callouts -->
    <text x="500" y="620">B Site</text>
    <text x="410" y="375">Mid / Window</text>
    <text x="500" y="748">B Entrance</text>
    <text x="500" y="762" class="label-small">(B Lane)</text>

    <!-- A site callouts -->
    <text x="820" y="430">A Site</text>
    <text x="890" y="695">A Long</text>
    <text x="900" y="555">A Lobby</text>
    <text x="680" y="545">A Short</text>

    <!-- Mid links -->
    <text x="260" y="262" class="label-small">C Link</text>
    <text x="740" y="262" class="label-small">A Link</text>
  </g>

  <!-- Legend -->
  <g transform="translate(20, 960)">
    <rect x="0" y="0" width="14" height="10" fill="#b85c5c" opacity="0.9"/>
    <text x="18" y="9" class="label-small" text-anchor="start">Site A</text>
    <rect x="70" y="0" width="14" height="10" fill="#5c6fb8" opacity="0.9"/>
    <text x="88" y="9" class="label-small" text-anchor="start">Site B</text>
    <rect x="140" y="0" width="14" height="10" fill="#e67e22" opacity="0.9"/>
    <text x="158" y="9" class="label-small" text-anchor="start">Site C</text>
    <rect x="210" y="0" width="14" height="10" fill="#3d3d6b" opacity="0.9"/>
    <text x="228" y="9" class="label-small" text-anchor="start">ATK</text>
    <rect x="270" y="0" width="14" height="10" fill="#3d6b3d" opacity="0.9"/>
    <text x="288" y="9" class="label-small" text-anchor="start">DEF</text>
    <text x="400" y="9" class="label-small" text-anchor="start">VALIQ - Not endorsed by Riot Games</text>
  </g>
</svg>
